<script src="js/script.js"></script>

<!-- ======================================
GOOGLE MAPS
====================================== -->

<section id="contact" class="maps">

    <div class="container">

        <div class="section-title">

            <span>Lokasi</span>

            <h2>Temukan Kami</h2>

            <p>
                Kunjungi TAHU GEJROT PAKDE BURUNG atau pesan melalui WhatsApp.
            </p>

        </div>

        <div class="map-box">

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.7467248387097!2d106.69670287409542!3d-6.16466366041404!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69f952f2b754e1%3A0x637ce7265516e319!2sTahu%20Gejrot%20Pakde%20Burung!5e0!3m2!1sid!2sid!4v1785217780245!5m2!1sid!2sid"
                loading="lazy"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>

    </div>

</section>
<!-- ======================================
     FORM PEMESANAN
====================================== -->

<section class="order" id="order">

    <div class="container">

        <div class="section-title">
            <span>Pesan Sekarang</span>
            <h2>Form Pemesanan</h2>
        </div>

        <form id="orderForm" class="order-form">

            <!-- Nama -->
            <div class="form-group">
                <label>Nama Pemesan</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama Anda"
                    required>
            </div>

            <!-- WhatsApp -->
            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input
                    type="tel"
                    id="wa"
                    placeholder="08xxxxxxxxxx"
                    required>
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label>Alamat Pengiriman</label>
                <textarea
                    id="alamat"
                    rows="3"
                    placeholder="Masukkan alamat lengkap"
                    required></textarea>
            </div>

            <!-- Menu -->
            <div class="form-group">
                <label>Menu</label>

                <select
                    id="menu"
                    onchange="hitungTotal()"
                    required>

                    <option value="">-- Pilih Menu --</option>

                    <option value="10000">
                        Tahu Gejrot Original - Rp10.000
                    </option>

                    <option value="15000">
                        Tahu Gejrot Extra Pedas - Rp15.000
                    </option>

                    <option value="5000">
                        Es Teh Manis - Rp5.000
                    </option>

                </select>
            </div>

            <!-- Jumlah -->
            <div class="form-group">
                <label>Jumlah Porsi</label>

                <input
                    type="number"
                    id="jumlah"
                    min="1"
                    value="1"
                    oninput="hitungTotal()"
                    required>

            </div>

            <!-- Total -->
            <div class="form-group">
                <label>Total Harga</label>

                <input
                    type="text"
                    id="total"
                    readonly
                    placeholder="Rp 0">
            </div>

            <!-- Tingkat Pedas -->
            <div class="form-group">
                <label>Tingkat Kepedasan</label>

                <select id="pedas">

                    <option>Tidak Pedas</option>
                    <option>Sedang</option>
                    <option>Pedas</option>
                    <option>Extra Pedas</option>

                </select>
            </div>

            <!-- Catatan -->
            <div class="form-group">
                <label>Catatan</label>

                <textarea
                    id="catatan"
                    rows="3"
                    placeholder="Contoh: Banyak kuah, tanpa bawang"></textarea>

            </div>

            <!-- Pembayaran -->
            <div class="form-group">

                <label>Metode Pembayaran</label>

                <select
                    id="payment"
                    onchange="showPaymentInfo()"
                    required>

                    <option value="">-- Pilih Metode Pembayaran --</option>

                    <option value="cod">Tunai (COD)</option>
                    <option value="qris">QRIS</option>
                    <option value="dana">DANA</option>
                    <option value="gopay">GoPay</option>
                    <option value="ovo">OVO</option>
                    <option value="transfer">Transfer Bank</option>

                </select>

            </div>

            <!-- Informasi Pembayaran -->
            <div id="payment-info" class="payment-info"></div>

            <!-- Tombol -->
            <button type="submit" class="btn-order">
                Pesan via WhatsApp
            </button>

        </form>

    </div>

</section>

<script src="script.js"></script>

</body.>


</html>
